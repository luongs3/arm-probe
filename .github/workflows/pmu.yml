name: pmu-probe
on: [workflow_dispatch, push]
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: PMU with paranoid lowered
        run: |
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic 2>/dev/null || true
          echo "before: $(cat /proc/sys/kernel/perf_event_paranoid)"
          sudo sysctl -w kernel.perf_event_paranoid=-1 2>&1 | tail -1
          echo "after:  $(cat /proc/sys/kernel/perf_event_paranoid)"
          echo "=== perf stat retry ==="
          perf stat -e cycles,instructions,cache-misses true 2>&1 | tail -15
