name: pmu-probe
on: [workflow_dispatch, push]
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Can we read PMU counters?
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq linux-tools-common linux-tools-generic 2>/dev/null || true
          echo "=== perf_event_paranoid ==="; cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || echo "absent"
          echo "=== perf stat try ==="
          perf stat -e cycles,instructions true 2>&1 | tail -20 || echo "perf FAILED rc=$?"
          echo "=== PMU devices ==="; ls /sys/bus/event_source/devices/ 2>/dev/null || echo none
